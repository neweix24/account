name: Account CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, Edge Function check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck Next.js application
        run: npm run typecheck

      - name: Check Supabase Edge Function
        run: deno check supabase/functions/neweix-username-login/index.ts

      - name: Check deployed Auth hook Edge Function
        run: deno check supabase/functions/before-user-created/index.ts supabase/functions/neweix-username-login/password_validation_test.ts

      - name: Test username/email identifier classification
        run: deno test supabase/functions/neweix-username-login/validation_test.ts supabase/functions/neweix-username-login/password_validation_test.ts

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Package Cloudflare Worker preview
        run: npx opennextjs-cloudflare build

      - name: Validate production Worker configuration without deploying
        run: npx wrangler deploy --dry-run --config wrangler.production.jsonc
