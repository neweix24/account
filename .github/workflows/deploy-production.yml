name: Deploy Account to Production

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "supabase/functions/**"
      - "wrangler.production.jsonc"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Account Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and deploy production Worker
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "8ac926e7573e6b45edab34c3346b366c"
